<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root{--blue:#002AC2;--yellow:#FFE200;--ink:#1B2432;--body:#6C7280;--line:#E4E6EC;--page:#F4F5F8}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--page);color:var(--ink)}
  .wrap{max-width:940px;margin:0 auto;padding:24px 18px 60px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.02em}
  .brand .mk{width:30px;height:30px;border-radius:8px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800}
  .muted{color:var(--body);font-size:.85rem}
  .btn{border:0;border-radius:10px;padding:11px 18px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn--primary{background:var(--blue);color:#fff}
  .btn--ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn--danger{background:#fff;border:1px solid #e7c3c0;color:#C0392B;padding:7px 12px;font-size:.8rem;border-radius:8px}
  .btn:disabled{opacity:.55;cursor:default}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 10px 30px rgba(16,20,30,.05)}
  input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:.95rem;font-family:inherit;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,42,194,.12)}
  label{display:block;font-size:.78rem;color:var(--body);margin:0 0 5px;font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid-3{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:12px;align-items:end}
  .tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--body)}
  .tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--body);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em}
  .pill{display:inline-block;padding:3px 9px;border-radius:999px;background:#EEF1F7;font-size:.72rem;font-weight:600}
  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .msg{font-size:.82rem;margin:10px 2px 0;min-height:16px}
  .msg.err{color:#C0392B}.msg.ok{color:var(--blue)}
  .hide{display:none}
  .login{max-width:380px;margin:8vh auto 0}
  .login h1{font-size:1.3rem;margin:0 0 4px}
  .center{display:flex;align-items:center;justify-content:center;gap:8px}
  .scroll{overflow-x:auto}
  h2{font-size:1.05rem;margin:0 0 14px}
  .link{background:none;border:0;color:var(--blue);font-weight:600;cursor:pointer;font-size:.82rem;padding:0}
  @media(max-width:640px){.grid,.grid-3{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="wrap">
  <div class="login card">
    <div class="center" style="justify-content:flex-start;margin-bottom:14px"><span class="mk brand" style="width:34px;height:34px">C</span><strong>Capital Logistics — Admin</strong></div>
    <h1>Sign in</h1>
    <p class="muted" style="margin-top:4px">Enter the admin password to manage the site.</p>
    <div style="margin-top:16px">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn btn--primary" style="width:100%;margin-top:16px" id="loginBtn" onclick="login()">Sign in</button>
    <p id="loginMsg" class="msg"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="appView" class="wrap hide">
  <div class="topbar">
    <div class="brand"><span class="mk">C</span> Capital Logistics — Admin</div>
    <button class="btn btn--ghost" onclick="logout()">Sign out</button>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabShip" onclick="showTab('ship')">Shipments</button>
    <button class="tab" id="tabNews" onclick="showTab('news')">Newsletter</button>
  </div>

  <!-- SHIPMENTS -->
  <div id="shipPane">
    <div class="card" style="margin-bottom:16px">
      <h2 id="formTitle">Add a shipment</h2>
      <div class="grid">
        <div><label>Reference *</label><input id="f_ref" placeholder="CL-2024-001234"></div>
        <div><label>Status</label><input id="f_status" placeholder="IN TRANSIT"></div>
        <div><label>Origin</label><input id="f_origin" placeholder="Matadi Port Terminal"></div>
        <div><label>Destination</label><input id="f_dest" placeholder="Kinshasa Warehouse 03"></div>
        <div><label>Stage</label>
          <select id="f_step">
            <option value="1">1 — Picked up</option>
            <option value="2" selected>2 — In transit</option>
            <option value="3">3 — At customs</option>
            <option value="4">4 — Out for delivery</option>
            <option value="5">5 — Delivered</option>
          </select>
        </div>
      </div>
      <div class="center" style="justify-content:flex-start;margin-top:16px">
        <button class="btn btn--primary" id="saveBtn" onclick="saveShipment()">Save shipment</button>
        <button class="btn btn--ghost hide" id="cancelBtn" onclick="resetForm()">Cancel edit</button>
      </div>
      <p id="shipMsg" class="msg"></p>
    </div>

    <div class="card">
      <div class="center" style="justify-content:space-between"><h2 style="margin:0">Current shipments</h2><button class="link" onclick="loadShipments()">Refresh</button></div>
      <div class="scroll" style="margin-top:12px">
        <table><thead><tr><th>Reference</th><th>Status</th><th>Origin</th><th>Destination</th><th>Stage</th><th></th></tr></thead>
        <tbody id="shipRows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table>
      </div>
    </div>
  </div>

  <!-- NEWSLETTER -->
  <div id="newsPane" class="hide">
    <div class="card">
      <div class="center" style="justify-content:space-between"><h2 style="margin:0">Newsletter sign-ups</h2><button class="link" onclick="loadNewsletter()">Refresh</button></div>
      <div class="scroll" style="margin-top:12px">
        <table><thead><tr><th>Email</th><th>Date</th></tr></thead><tbody id="newsRows"><tr><td colspan="2" class="muted">Loading…</td></tr></tbody></table>
      </div>
    </div>
  </div>
</div>

<script>
  var PW = "";
  function $(id){ return document.getElementById(id); }
  function esc(s){ var d=document.createElement('div'); d.textContent=(s==null?'':String(s)); return d.innerHTML; }

  function login(){
    var pw=$('pw').value; if(!pw) return;
    $('loginBtn').disabled=true; $('loginMsg').textContent='';
    google.script.run.withSuccessHandler(function(res){
      $('loginBtn').disabled=false;
      if(res && res.ok){ PW=pw; $('loginView').classList.add('hide'); $('appView').classList.remove('hide'); loadShipments(); }
      else { $('loginMsg').textContent='Incorrect password.'; $('loginMsg').className='msg err'; }
    }).withFailureHandler(function(){ $('loginBtn').disabled=false; $('loginMsg').textContent='Connection error. Try again.'; $('loginMsg').className='msg err'; })
      .apiLogin(pw);
  }
  function logout(){ PW=""; $('appView').classList.add('hide'); $('loginView').classList.remove('hide'); $('pw').value=''; }

  function showTab(t){
    $('tabShip').classList.toggle('active', t==='ship'); $('tabNews').classList.toggle('active', t==='news');
    $('shipPane').classList.toggle('hide', t!=='ship'); $('newsPane').classList.toggle('hide', t!=='news');
    if(t==='news') loadNewsletter();
  }

  function loadShipments(){
    google.script.run.withSuccessHandler(function(res){ if(res&&res.ok) renderShipments(res.rows); }).apiListShipments(PW);
  }
  function renderShipments(rows){
    var tb=$('shipRows');
    if(!rows||!rows.length){ tb.innerHTML='<tr><td colspan="6" class="muted">No shipments yet.</td></tr>'; return; }
    tb.innerHTML=rows.map(function(r){
      return '<tr><td><strong>'+esc(r.reference)+'</strong></td><td><span class="pill">'+esc(r.status)+'</span></td><td>'+esc(r.origin)+'</td><td>'+esc(r.destination)+'</td><td>'+esc(r.step)+'/5</td>'+
        '<td><div class="row-actions"><button class="btn--ghost btn" style="padding:6px 12px;font-size:.8rem" onclick="editShipment(\''+esc(r.reference)+'\')">Edit</button>'+
        '<button class="btn--danger" onclick="deleteShipment(\''+esc(r.reference)+'\')">Delete</button></div></td></tr>';
    }).join('');
    window.__rows=rows;
  }
  function editShipment(ref){
    var r=(window.__rows||[]).filter(function(x){return x.reference===ref;})[0]; if(!r) return;
    $('f_ref').value=r.reference; $('f_status').value=r.status; $('f_origin').value=r.origin; $('f_dest').value=r.destination; $('f_step').value=r.step;
    $('formTitle').textContent='Edit '+r.reference; $('cancelBtn').classList.remove('hide');
    window.scrollTo(0,0);
  }
  function resetForm(){
    ['f_ref','f_status','f_origin','f_dest'].forEach(function(id){$(id).value='';}); $('f_step').value='2';
    $('formTitle').textContent='Add a shipment'; $('cancelBtn').classList.add('hide'); $('shipMsg').textContent='';
  }
  function saveShipment(){
    var row={reference:$('f_ref').value.trim(), status:$('f_status').value.trim(), origin:$('f_origin').value.trim(), destination:$('f_dest').value.trim(), step:$('f_step').value};
    if(!row.reference){ $('shipMsg').textContent='Reference is required.'; $('shipMsg').className='msg err'; return; }
    $('saveBtn').disabled=true; $('shipMsg').textContent='Saving…'; $('shipMsg').className='msg';
    google.script.run.withSuccessHandler(function(res){
      $('saveBtn').disabled=false;
      if(res&&res.ok){ renderShipments(res.rows); resetForm(); $('shipMsg').textContent='Saved.'; $('shipMsg').className='msg ok'; setTimeout(function(){$('shipMsg').textContent='';},1500); }
      else { $('shipMsg').textContent=(res&&res.error)||'Could not save.'; $('shipMsg').className='msg err'; }
    }).withFailureHandler(function(){ $('saveBtn').disabled=false; $('shipMsg').textContent='Connection error.'; $('shipMsg').className='msg err'; })
      .apiSaveShipment(PW,row);
  }
  function deleteShipment(ref){
    if(!confirm('Delete shipment '+ref+'?')) return;
    google.script.run.withSuccessHandler(function(res){ if(res&&res.ok) renderShipments(res.rows); }).apiDeleteShipment(PW,ref);
  }

  function loadNewsletter(){
    google.script.run.withSuccessHandler(function(res){
      var tb=$('newsRows');
      if(!res||!res.ok){ tb.innerHTML='<tr><td colspan="2" class="muted">Could not load.</td></tr>'; return; }
      if(!res.rows.length){ tb.innerHTML='<tr><td colspan="2" class="muted">No sign-ups yet.</td></tr>'; return; }
      tb.innerHTML=res.rows.map(function(r){ return '<tr><td>'+esc(r.email)+'</td><td class="muted">'+esc((r.date||'').slice(0,24))+'</td></tr>'; }).join('');
    }).apiListNewsletter(PW);
  }
</script>
</body>
</html>
