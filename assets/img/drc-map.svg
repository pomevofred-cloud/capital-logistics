<svg class="drc-map" viewBox="0 0 1000 979" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Democratic Republic of the Congo operating network — Atlantic ports to inland hubs">
<style>
.drc-flow{stroke-dasharray:2 12;animation:drcFlow 2.4s linear infinite}
@keyframes drcFlow{to{stroke-dashoffset:-14}}
.drc-ping{transform-box:fill-box;transform-origin:center;animation:drcPing 3s ease-out infinite}
@keyframes drcPing{0%{opacity:.5;transform:scale(.4)}75%{opacity:0;transform:scale(3)}100%{opacity:0;transform:scale(3)}}
.drc-ping.b{animation-delay:1s}.drc-ping.c{animation-delay:2s}
.veh{fill:#FFE200;stroke:#0F1A4A;stroke-width:1.2}
@media (prefers-reduced-motion:reduce){.drc-flow,.veh{display:none}.drc-ping{animation:none;opacity:.18}}
</style>
